<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>サクゲー ～ヒデアキの逆襲～</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2e365e,#101325 75%);color:#fff5d8;font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:980px;margin:auto;padding:10px}h1{text-align:center;font-size:clamp(20px,4vw,32px);margin:5px 0}.sub{text-align:center;color:#cbd5fa;font-size:12px;margin-bottom:8px}#frame{position:relative;border:4px solid #f5d36d;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px #794da2;background:#11172b}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070c1cd9;padding:12px}#overlay.hidden{display:none}.card{position:relative;width:min(95%,680px);min-height:290px;background:#20294b;border:3px solid #ffdf78;border-radius:12px;padding:20px;text-align:center;box-shadow:0 8px 0 #0a1028}.card h2{font-size:clamp(23px,4vw,34px);color:#ffe875;margin:3px 0 12px}.card p{line-height:1.65}.commands{position:absolute;right:12px;bottom:10px;text-align:left;border:1px solid #8795cb;background:#0d1733;border-radius:8px;padding:7px 10px;font-size:clamp(10px,1.6vw,13px);line-height:1.7}.commands b{color:#ffeb85}button{font:inherit;font-weight:700;color:white;background:#374777;border:2px solid #92a3dc;border-radius:10px;min-height:44px;padding:9px;touch-action:manipulation}button:active{background:#6478bc;transform:translateY(1px)}#startBtn{background:#b34b85;border-color:#ffc3e7;padding:12px 25px;font-size:17px;margin-bottom:55px}#hud{display:flex;align-items:center;gap:9px;padding:8px;background:#171d38;font-weight:bold;font-size:13px;flex-wrap:wrap}.meter{flex:1;min-width:85px;height:13px;border:2px solid white;background:#50253b;border-radius:9px;overflow:hidden}#hpbar{height:100%;background:#79e96b;width:100%}#message{background:#292f55;color:#fff0a5;text-align:center;min-height:29px;padding:5px;font-size:14px;font-weight:bold}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pad,.actions{display:grid;gap:6px;border:1px solid #566293;background:#1c2543;border-radius:10px;padding:9px}.pad{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:1fr 1fr}.actions button{font-size:13px}#melosBtn{display:none;grid-column:1/-1;background:#a84c50;border-color:#ffed89;animation:pulse .45s infinite alternate}@keyframes pulse{to{filter:brightness(1.45)}}.tips{text-align:center;color:#c9d4ef;font-size:12px;line-height:1.7;margin:9px}@media(max-width:560px){.controls{grid-template-columns:1fr}.pad{max-width:340px;width:100%;margin:auto}.card{min-height:300px;padding:12px}.card p{font-size:12px}.commands{font-size:10px;bottom:8px;right:8px}#startBtn{margin-bottom:85px}#hud{font-size:11px}}
</style></head><body><main><h1>サクゲー ～ヒデアキの逆襲～</h1><div class="sub">キャラクターイラスト版 ver.12</div><div id="frame"><canvas id="game" width="800" height="450"></canvas><div id="overlay"><div class="card"><h2 id="overlayTitle">ヒデアキの逆襲！</h2><p id="overlayText">ザコを蹴散らし、さくお家のボスたちに挑め！</p><button id="startBtn">ゲームスタート</button><div class="commands"><b>コマンド</b><div>← ↑ ↓ →：移動</div><div>K：ハゲビーム</div><div>Enter：開始・続ける</div></div></div></div></div><div id="hud"><span>HP <span id="hpnum">100</span></span><div class="meter"><div id="hpbar"></div></div><span id="stage">準備中</span><span>撃破 <span id="score">0</span></span></div><div id="message">ゲームスタートを押してね！</div><div class="controls"><div class="pad"><span></span><button data-move="ArrowUp">▲</button><span></span><button data-move="ArrowLeft">◀</button><button data-move="ArrowDown">▼</button><button data-move="ArrowRight">▶</button></div><div class="actions"><button data-action="beam">K：ハゲビーム</button><button id="melosBtn" data-action="melos">Lを連打！</button><button data-action="continue" style="grid-column:1/-1">▶ 続ける／再挑戦</button></div></div><div class="tips">ビール HP＋20 ／ 日本酒・万寿 HP＋50 ／ きゅうりは罠 HP－30。<br>敵を倒すと回復アイテムが上から落下！　必殺技のチャンスが来たら「Lを連打！」</div></main><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),$=s=>document.getElementById(s);g.imageSmoothingEnabled=true;let mode='title',tick=0,score=0,stage=0,hp=100,hero={x:65,y:280,inv:0,glow:0},grunts=[],boss=null,shots=[],items=[],fx=[],messageUntil=0,melos={phase:'idle',charge:0,window:0,dash:0},transition=0,flash=0,announcement={label:'',until:0},erikoRush=0,keys={},beamCooldown=0,beamPending=0,firstCry=false;
const types=[{name:'トンカツ',bullet:'コレステロール',hp:3.5,col:'#e8a94b',kind:'cutlet'},{name:'ショートケーキ',bullet:'中性脂肪',hp:3.5,col:'#f9a9c5',kind:'cake'},{name:'レバー串',bullet:'尿酸',hp:3.5,col:'#b07654',kind:'liver'}];const bosses=[{name:'シュウ',hp:16},{name:'カイ',hp:19},{name:'エリコ',hp:22},{name:'エビコ',hp:26}];
function text(s,x,y,size=18,color='#fff',align='left'){g.textAlign=align;g.font=`bold ${size}px system-ui, sans-serif`;g.fillStyle='#0d1028';g.fillText(s,x+2,y+2);g.fillStyle=color;g.fillText(s,x,y);g.textAlign='left'}function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function say(s,d=100){$('message').textContent=s;messageUntil=tick+d}function announce(label,d=65){announcement={label,until:tick+d};flash=Math.max(flash,5)}function showOverlay(title,body,button){$('overlayTitle').textContent=title;$('overlayText').innerHTML=body;$('startBtn').textContent=button;$('overlay').classList.remove('hidden')}function hideOverlay(){$('overlay').classList.add('hidden')}function hud(){$('hpnum').textContent=Math.max(0,Math.ceil(hp));$('hpbar').style.width=Math.max(0,hp)+'%';$('stage').textContent=mode==='grunt'?'ザコ戦':mode==='boss'?bosses[stage].name:mode==='transform'?'変身中':mode==='win'?'クリア':'準備中';$('score').textContent=score;$('melosBtn').style.display=melos.phase==='charge'?'block':'none'}
function reset(){announcement={label:'',until:0};erikoRush=0;mode='grunt';tick=0;score=0;stage=0;hp=100;hero={x:65,y:280,inv:0,glow:0};shots=[];items=[];fx=[];melos={phase:'idle',charge:0,window:0,dash:0};beamCooldown=0;beamPending=0;spawnGrunts();hideOverlay();say('トンカツ・ケーキ・レバー串が襲ってくる！',150)}function spawnGrunts(){mode='grunt';boss=null;grunts=types.map((t,i)=>({...t,x:385+i*126,y:145+(i%2)*115,w:69,h:68,maxhp:t.hp,cd:45+i*30,alive:true,wiggle:i*2}));melos.phase='idle';melos.charge=0;hud()}function spawnBoss(){mode='boss';erikoRush=0;let b=bosses[stage];boss={x:580,y:157,w:105,h:123,hp:b.hp,maxhp:b.hp,cd:75,cry:0,vomit:0,spin:0,rushCd:240,poopCd:185,poopWarn:0};firstCry=false;shots=[];melos={phase:'idle',charge:0,window:0,dash:0};say('ボス登場！ '+b.name,125);hud()}
function startOrContinue(){if(mode==='title'||mode==='win'){reset();return}if(mode==='over'){hp=100;hero.inv=90;shots=[];items=[];fx=[];melos={phase:'idle',charge:0,window:0,dash:0};if(stage===0&&grunts.some(e=>e.alive))spawnGrunts();else spawnBoss();hideOverlay();say('HP100で再挑戦！',90);return}if(mode==='between'){spawnBoss();hideOverlay()}}
$('startBtn').addEventListener('click',startOrContinue);document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.action;if(a==='continue')startOrContinue();else attack(a)}));window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;const k=e.key.toLowerCase();if(k==='l'&&melos.phase==='charge'){attack('melos');return}if(e.repeat)return;if(k==='k')attack('beam');if(e.key==='Enter')startOrContinue()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>keys={});
function attack(type){if(!['grunt','boss'].includes(mode))return;if(type==='melos'){if(melos.phase!=='charge'||stage!==3||mode!=='boss')return;melos.charge=Math.min(100,melos.charge+20);fx.push({x:hero.x+15,y:hero.y-10,label:'+10',life:20,color:'#ffef7a'});if(melos.charge>=100){melos.phase='dash';melos.dash=120;hero.inv=85;flash=10;announce('ママチャリアタック',110);say('ママチャリアタック！ 無敵で走り回れ！',130)}return}if(type==='beam'&&beamCooldown<=0&&beamPending===0){beamPending=22;hero.glow=22;beamCooldown=62;say('頭が光りだした……！',45)}}

function drawHero(){
 if(hero.inv>0&&tick%8<4&&melos.phase!=='dash')return;
 let x=hero.x,y=hero.y;
 if(melos.phase==='dash'){
  circle(x+7,y+57,18,'#182538');circle(x+65,y+57,18,'#182538');circle(x+7,y+57,12,'#d8e4f5');circle(x+65,y+57,12,'#d8e4f5');
  g.strokeStyle='#31b5ed';g.lineWidth=5;g.beginPath();g.moveTo(x+7,y+57);g.lineTo(x+30,y+29);g.lineTo(x+42,y+57);g.lineTo(x+7,y+57);g.moveTo(x+30,y+29);g.lineTo(x+65,y+57);g.stroke();box(x+58,y+14,25,18,'#b5c3c9');
  sprite('hero',x+11,y-26,57,72);text('ママチャリ',x+37,y-31,14,'#ffeb87','center');return;
 }
 let bow=beamPending>0?Math.min(22,(23-beamPending)*1.1):0;
 g.save();if(bow>0){g.translate(x+31,y+44);g.rotate(Math.min(.85,bow*.039));g.translate(-x-31,-y-44)}
 sprite('hero',x-12,y-39,83,109);g.restore();
 if(hero.glow>0){circle(x+32+bow*.6,y-23+bow*.4,13+Math.sin(tick*1.2)*4,'#fff5a0');circle(x+32+bow*.6,y-23+bow*.4,7,'#fff')}
 text('ヒデアキ',x+29,y+75,13,'#fff1b7','center')
}
function drawFood(e){let x=e.x,y=e.y+Math.sin(tick*.06+e.wiggle)*4;g.save();g.lineWidth=3;g.strokeStyle='#29233a';g.fillStyle=e.kind==='cutlet'?'#e6a64c':e.kind==='cake'?'#fff1eb':'#9a573a';g.beginPath();g.roundRect(x+8,y+10,56,46,12);g.fill();g.stroke();if(e.kind==='cutlet'){g.strokeStyle='#c37a30';for(let i=0;i<5;i++){g.beginPath();g.moveTo(x+16+i*9,y+17);g.lineTo(x+16+i*9,y+47);g.stroke()}}if(e.kind==='cake'){g.fillStyle='#ff7199';g.beginPath();g.arc(x+35,y+12,10,0,Math.PI*2);g.fill();g.fillStyle='#f3aac8';g.fillRect(x+12,y+36,48,10)}if(e.kind==='liver'){g.strokeStyle='#d6ac69';g.lineWidth=6;g.beginPath();g.moveTo(x,y+49);g.lineTo(x+74,y+20);g.stroke()}g.fillStyle='#171521';g.beginPath();g.arc(x+27,y+30,3,0,7);g.arc(x+48,y+30,3,0,7);g.fill();g.strokeStyle='#171521';g.lineWidth=2;g.beginPath();g.arc(x+37,y+36,7,0,Math.PI);g.stroke();g.restore();text(e.name,x+34,y-5,13,'#fff2d0','center')}

function drawBoss(){if(!boss)return;let b=boss,x=b.x,y=b.y;g.save();
 if(mode==='transform'){g.translate(x+52,y+62);g.rotate(b.spin);g.translate(-x-52,-y-62)}
 let names=['shuei','kaiei','eriko','ebiko'];let who=names[stage];
 let sway=Math.sin(tick*.07)*3;let rush=stage===2&&erikoRush>0?Math.sin(tick*.25)*14:0;
